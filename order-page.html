/* =========================================
ORDER PAGE CHANGE 2
DESKTOP ACCESS BLOCKER
========================================= */

.desktop-access-blocker {

inset:0;
z-index:2147483647;
display:none;
align-items:center;
justify-content:center;
padding:clamp(26px,5vw,72px);
background:
radial-gradient(
ellipse 72% 58% at 50% 42%,
rgba(36,40,40,.28) 0%,
rgba(16,18,18,.80) 46%,
rgba(7,8,8,.985) 100%
),
linear-gradient(
180deg,
#111313 0%,
#090a0a 100%
);

overflow:hidden;
overscroll-behavior:none;
}

.desktop-access-blocker::before {
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(
rgba(255,255,255,.018) 1px,
transparent 1px

linear-gradient(

rgba(255,255,255,.018) 1px,
transparent 1px

}

.desktop-access-blocker-panel {
position:relative;
z-index:2;
width:min(640px,100%);
padding:
clamp(38px,5vw,62px)
clamp(34px,5vw,68px);
border:1px solid rgba(255,255,255,.13);
border-top:3px solid var(--orange);
background:
linear-gradient(
145deg,
rgba(20,22,22,.985),
rgba(9,10,10,.995)
);
box-shadow:
0 34px 100px rgba(0,0,0,.56);

}

.desktop-access-blocker-panel::before {

.desktop-access-blocker-panel h1 {

}

.desktop-access-blocker-panel p {

HEADER

.address-line {

}

.action-icons {

justify-content:center;
}

.action-icons button,
.action-icons a.header-icon-button {

height:42px;

.action-icons button:hover,
.action-icons a.header-icon-button:hover {

}

.action-icons button.is-selected {

color:var(--orange-bright);
background:#191714;
box-shadow:
0 0 0 1px rgba(232,120,23,.08),
0 7px 22px rgba(0,0,0,.24);
}

/* =========================================
WHATSAPP ACTION
========================================= */

.whatsapp-action {
position:absolute;
left:50%;
bottom:calc(100% + 15px);
z-index:85;
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:7px;
background:
linear-gradient(
145deg,
#36e676 0%,
#25d366 52%,
#179b46 100%
);
border:1px solid rgba(255,255,255,.30);
box-shadow:
0 15px 30px rgba(0,0,0,.55),
0 0 14px rgba(37,211,102,.18),
inset 0 1px 0 rgba(255,255,255,.30);
opacity:0;
visibility:hidden;
pointer-events:none;
transform:
translate(-50%,20px)
scale(.58);
transform-origin:center bottom;
transition:
opacity .2s ease,
visibility .2s ease,
transform .38s cubic-bezier(.18,.82,.28,1.35);
}

.whatsapp-action.is-open {
opacity:1;
visibility:visible;
pointer-events:auto;
transform:
translate(-50%,0)
scale(1);
animation:whatsappAttention 4s ease-in-out .9s infinite;
}

.whatsapp-action svg {
width:27px;
height:27px;
display:block;
fill:#ffffff;
filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
}

.whatsapp-action:hover,
.whatsapp-action:active {
transform:
translate(-50%,-2px)
scale(1.04);
box-shadow:
0 18px 35px rgba(0,0,0,.62),
0 0 22px rgba(37,211,102,.38),
inset 0 1px 0 rgba(255,255,255,.38);
}

@keyframes whatsappAttention {

0%,
72%,
100% {
transform:
translate(-50%,0)
scale(1);
}

78% {
transform:
translate(-50%,-2px)
scale(1.045);
}

83% {
transform:
translate(-50%,0)
scale(.99);
}

88% {
transform:
translate(-50%,0)
scale(1);
}

}

/* =========================================
HEADER BASKET TOTAL
========================================= */

.basket-total-text {
position:absolute;
top:-16px;
left:50%;
z-index:5;
font-family:
"Bahnschrift Condensed",

"Aptos",
sans-serif;

translate(-50%,7px)

}

.basket-total-text.is-visible {

translate(-50%,0)

opacity .22s ease,

}

.basket-total-text.is-updating {

}

@keyframes basketTotalUpdate {

0% {

translate(-50%,0)

}

42% {

translate(-50%,-4px)
scale(1.12);

}

72% {

translate(-50%,1px)

}

100% {

translate(-50%,0)
scale(1);
}

}

/* =========================================
BASKET DRAWER
70% SCREEN WIDTH RETAINED
========================================= */

.basket-drawer-layer {
position:fixed;
inset:0;
z-index:2000000000;
visibility:hidden;
pointer-events:none;
overflow:hidden;
}

.basket-drawer-layer.is-open {
visibility:visible;
pointer-events:auto;
}

.basket-drawer-backdrop {
position:absolute;
inset:0;
z-index:1;
background:rgba(0,0,0,.72);
opacity:0;
transition:opacity .34s ease;
cursor:pointer;
}

.basket-drawer-layer.is-open
.basket-drawer-backdrop {
opacity:1;
}

.basket-drawer-panel {
position:absolute;
top:0;
right:0;
z-index:2;
width:70vw;
max-width:70vw;
min-width:0;
height:100vh;
height:100dvh;
display:grid;
grid-template-rows:auto minmax(0,1fr) auto;
overflow:hidden;
background:
linear-gradient(
180deg,
#111414 0%,
#0b0d0d 52%,
#080a0a 100%
);
border-left:1px solid rgba(255,255,255,.14);
box-shadow:
-26px 0 70px rgba(0,0,0,.54);
transform:translateX(100%);
transition:transform .42s cubic-bezier(.18,.72,.28,1);
outline:0;
}

.basket-drawer-layer.is-open
.basket-drawer-panel {
transform:translateX(0);
}

.basket-drawer-header {
position:relative;
z-index:4;
display:grid;
grid-template-columns:minmax(0,1fr) auto;
align-items:center;
gap:12px;
padding:
clamp(15px,2vw,22px)
clamp(13px,2vw,22px);

linear-gradient(
180deg,
rgba(20,23,23,.995),
rgba(13,15,15,.995)
);
border-bottom:1px solid rgba(255,255,255,.11);
box-shadow:0 10px 24px rgba(0,0,0,.22);
}

.basket-drawer-heading-wrap {
min-width:0;
}

.basket-drawer-kicker {
display:block;
margin-bottom:5px;
color:var(--orange);
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:7px;
font-weight:800;
line-height:1;
letter-spacing:1.35px;
text-transform:uppercase;
}

.basket-drawer-title {
margin:0;
color:var(--cream);
font-family:
"Bahnschrift SemiCondensed",
"Aptos Display",
"Arial Narrow",
sans-serif;
font-size:clamp(19px,3vw,30px);
font-weight:800;
line-height:.95;
letter-spacing:-.7px;
}

.basket-drawer-count {
display:block;
margin-top:6px;
color:rgba(247,247,243,.43);

"Bahnschrift",
"Aptos",
sans-serif;
font-size:7px;
font-weight:700;
line-height:1.2;
letter-spacing:.65px;
text-transform:uppercase;
}

.basket-drawer-close {
width:38px;
height:38px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,.17);
border-radius:10px;
background:#101212;
color:var(--cream);
font-family:
"Aptos",
"Segoe UI",
Arial,
sans-serif;
font-size:23px;
font-weight:300;
line-height:1;
cursor:pointer;
transition:
border-color .2s ease,
background .2s ease,
color .2s ease,
transform .15s ease;
}

.basket-drawer-close:hover {
border-color:rgba(232,120,23,.56);
background:#181513;
color:var(--orange-bright);
}

.basket-drawer-close:active {
transform:scale(.95);
}

.basket-drawer-body {
min-width:0;
overflow-x:hidden;
overflow-y:auto;
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
padding:
clamp(12px,1.7vw,18px)
clamp(10px,1.7vw,18px)
clamp(24px,3vw,36px);
scrollbar-width:thin;
scrollbar-color:
rgba(232,120,23,.55)
rgba(255,255,255,.035);
}

.basket-drawer-body::-webkit-scrollbar {
width:5px;
}

.basket-drawer-body::-webkit-scrollbar-track {
background:rgba(255,255,255,.025);
}

.basket-drawer-body::-webkit-scrollbar-thumb {
background:rgba(232,120,23,.52);
border-radius:999px;
}

.basket-drawer-items {
display:grid;
gap:10px;
min-width:0;
}

.basket-drawer-item {
min-width:0;
overflow:hidden;
border:1px solid rgba(255,255,255,.12);
border-left:2px solid rgba(232,120,23,.68);
border-radius:9px;
background:
linear-gradient(
180deg,
#141717,
#0c0e0e
);
transition:
border-color .22s ease,
background .22s ease,
box-shadow .22s ease;
}

.basket-drawer-item.is-expanded {
border-color:rgba(255,255,255,.17);
border-left-color:var(--orange);
box-shadow:0 9px 24px rgba(0,0,0,.18);
}

.basket-drawer-item-head {
display:block;
width:100%;
margin:0;
padding:12px 11px 10px;
border:0;
background:transparent;
color:inherit;
text-align:left;
cursor:pointer;
transition:
background .2s ease,
color .2s ease;
}

.basket-drawer-item-head:hover {
background:rgba(255,255,255,.018);
}

.basket-drawer-item-title {
display:block;
margin:0;
color:var(--cream);
font-family:
"Bahnschrift SemiCondensed",
"Aptos Display",
"Arial Narrow",
sans-serif;
font-size:clamp(13.2px,2.42vw,19.8px);
font-weight:800;
line-height:1.12;
letter-spacing:-.3px;
overflow-wrap:anywhere;
}

.basket-drawer-item-title-quantity {
color:var(--orange-bright);
white-space:nowrap;
}

.basket-drawer-item-title-size-line,
.basket-drawer-item-title-description {
display:block;
}

.basket-drawer-item-title-description {
margin-top:3px;
}

.basket-drawer-item-expand-strip {
position:relative;
width:100%;
height:26px;
margin:0;
padding:0;
display:flex;
align-items:center;
justify-content:center;
border:0;
border-top:1px solid rgba(255,255,255,.24);
border-bottom:1px solid rgba(255,255,255,.24);
background:#0a0b0b;
color:#ffffff;
cursor:pointer;
transition:
background .2s ease,
border-color .2s ease;
}

.basket-drawer-item-expand-strip:hover {
background:#101212;
border-color:rgba(255,255,255,.34);
}

.basket-drawer-item-expand-arrow {
position:relative;
display:block;
width:16px;
height:14px;
transform-origin:center center;
animation:
basketDrawerExpandPrompt
3.8s
ease-in-out
.7s
infinite;
}

.basket-drawer-item-expand-arrow::before {
content:"";
position:absolute;
left:50%;
top:3px;
width:6px;
height:6px;
border-right:1.5px solid rgba(255,255,255,.92);
border-bottom:1.5px solid rgba(255,255,255,.92);
transform:
translateX(-50%)
rotate(45deg);
}

.basket-drawer-item.is-expanded
.basket-drawer-item-expand-arrow {
animation:none;
transform:rotate(180deg);
}

@keyframes basketDrawerExpandPrompt {

0%,
68%,
100% {
transform:translateY(0) scale(1);
}

74% {
transform:translateY(2px) scale(1.08);
}

80% {
transform:translateY(-1px) scale(.98);
}

86% {
transform:translateY(2px) scale(1.05);
}

92% {
transform:translateY(0) scale(1);
}

}

.basket-drawer-item-collapse[hidden] {
display:none !important;
}

.basket-drawer-item-collapse:not([hidden]) {
animation:
basketDrawerItemReveal
.28s
cubic-bezier(.18,.72,.28,1)
both;
}

@keyframes basketDrawerItemReveal {

from {
opacity:0;
transform:translateY(-4px);
}

to {
opacity:1;
transform:translateY(0);
}

}

.basket-drawer-item-specs {
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px 16px;
min-width:0;
padding:12px 11px;
text-align:left;
}

.basket-drawer-item-spec {
min-width:0;
text-align:left;
}

.basket-drawer-item-spec span {
display:block;
color:rgba(247,247,243,.37);
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:6.3px;
font-weight:800;
line-height:1;
letter-spacing:.7px;
text-transform:uppercase;
}

.basket-drawer-item-spec strong {
display:block;
margin-top:4px;
color:#d6d8d5;
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:8.25px;
font-weight:700;
line-height:1.28;
overflow-wrap:anywhere;
text-align:left;
}

.basket-drawer-estimated-delivery-date {

.basket-drawer-empty h3 {

.basket-drawer-footer {

12px
clamp(10px,1.7vw,18px)

linear-gradient(

rgba(13,16,15,.995),

.basket-drawer-total-row.final strong {

/* =========================================
SCROLL REVEAL
========================================= */

.reveal {
opacity:0;
transform:translateY(34px);
transition:
opacity .85s ease,
transform .85s cubic-bezier(.18,.72,.28,1);
will-change:opacity,transform;
}

.reveal.reveal-left {
transform:translateX(-38px);
}

.reveal.reveal-right {
transform:translateX(38px);
}

.reveal.reveal-scale {
transform:translateY(22px) scale(.975);
}

.reveal.is-visible {
opacity:1;
transform:translate(0,0) scale(1);
}

.reveal-delay-1 {
transition-delay:.08s;
}

.reveal-delay-2 {
transition-delay:.16s;
}

.reveal-delay-3 {
transition-delay:.24s;
}

.reveal-delay-4 {
transition-delay:.32s;
}

/* =========================================
ORDER PAGE
========================================= */

.order-page {
position:relative;
overflow:hidden;
padding:38px 6% 54px;
background:
linear-gradient(
180deg,
#111313 0%,
#0d0f0f 100%
);
border-top:0;
border-bottom:1px solid rgba(255,255,255,.09);
}

.order-page::before {
content:"";
position:absolute;
top:0;
right:0;
width:38%;
height:100%;
background:
linear-gradient(
90deg,
transparent 0%,
rgba(255,255,255,.013) 100%
);
pointer-events:none;
}

.order-page::after {
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(
rgba(255,255,255,.018) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.018) 1px,
transparent 1px
);
background-size:48px 48px;
opacity:.45;
pointer-events:none;
}

.order-shell {
position:relative;
z-index:2;
max-width:1180px;
width:100%;
margin:0 auto;
padding:0;
}

/* =========================================
HEADING
========================================= */

.home-popular-title-wrap {
position:relative;
z-index:2;
max-width:1180px;
margin:0 auto 28px;
padding-bottom:19px;
border-bottom:1px solid rgba(255,255,255,.10);
}

.home-opening-title {
margin:0;
font-family:
"Bahnschrift",
"Arial Narrow",
"Aptos",
sans-serif;
font-size:11px;
line-height:1;
letter-spacing:2.35px;
font-weight:700;
text-transform:uppercase;
color:var(--steel);
}

.home-opening-title span {
display:block;
margin-top:8px;
font-family:
"Bahnschrift SemiCondensed",
"Aptos Display",
"Inter",
Arial,
sans-serif;
font-size:clamp(32px,4.8vw,58px);
line-height:.98;
letter-spacing:-1.35px;
font-weight:800;
color:var(--cream);
text-transform:none;
}

.order-opening-title span {
font-size:clamp(20.7px,2.76vw,36.8px);
}

.order-content-wrap {
position:relative;
z-index:2;
max-width:1180px;
width:100%;
margin:0 auto;
}

/* =========================================
ORDER CARD
========================================= */

.order-card {
position:relative;
overflow:visible;
border:1px solid rgba(255,255,255,.14);
background:
linear-gradient(
135deg,
rgba(20,22,22,.96),
rgba(10,11,11,.98) 58%,
rgba(7,8,8,.99)
);
box-shadow:
0 32px 90px rgba(0,0,0,.33);
padding:clamp(18px,2.1vw,29px);
}

.order-card::before {
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:
linear-gradient(
115deg,
rgba(255,255,255,.025),
transparent 28%,
transparent 72%,
rgba(232,120,23,.012)
);
}

/* =========================================
UPPER TWO-COLUMN CONFIGURATOR
========================================= */

.order-grid {
position:relative;
z-index:3;
display:grid;
grid-template-columns:minmax(0,44fr) minmax(0,56fr);
gap:0;
align-items:start;
}

/* =========================================
PRODUCT IMAGE
========================================= */

.product-visual-column {
min-width:0;
padding-right:clamp(20px,2.5vw,35px);
}

.product-image-frame {
position:relative;
overflow:hidden;
width:100%;
aspect-ratio:1.08 / 1;
background:#ffffff;
border:1px solid rgba(255,255,255,.10);
box-shadow:0 20px 52px rgba(0,0,0,.20);
}

.product-image-frame img {
position:relative;
left:var(--product-image-left,0%);
display:block;
width:100%;
height:100%;
object-fit:contain;
object-position:center center;
opacity:1;
transform:
scale(var(--product-image-scale,1.30))
rotate(var(--product-image-rotation,0deg));
transform-origin:center center;
will-change:opacity,transform,left;
transition:
opacity .28s ease,
transform .42s ease,
left .42s ease,
filter .32s ease;
}

.product-image-frame img.image-fade-out {
opacity:0;
}

.product-image-frame:hover img:not(.image-fade-out) {
transform:
scale(var(--product-image-hover-scale,1.335))
rotate(var(--product-image-rotation,0deg));
filter:contrast(1.015);
}

/* =========================================
LEFT CONTROLS
========================================= */

.visual-controls {
padding-top:18px;
}

.visual-control-block + .visual-control-block {
margin-top:15px;
}

.selector-heading {
margin-bottom:9px;
color:#81837f;
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:12.6px;
font-weight:800;
line-height:1;
letter-spacing:1.55px;
text-transform:uppercase;
}

/* =========================================
GLAZING SELECTOR
========================================= */

.glazing-selector {
display:grid;
grid-template-columns:1fr 1fr;
border:1px solid rgba(255,255,255,.18);
border-radius:16px 16px 0 0;
overflow:hidden;
background:#090a0a;
}

.glazing-selector button,
.tint-selector button {
position:relative;
border:0;
background:transparent;
color:#bfc0bd;
cursor:pointer;
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-weight:800;
text-transform:uppercase;
transition:
color .2s ease,
background .2s ease,
transform .15s ease;
}

.glazing-selector button {
min-height:49px;
font-size:12.65px;
letter-spacing:1.2px;
}

.glazing-selector button + button {
border-left:1px solid rgba(255,255,255,.12);
}

.glazing-selector button.active {
background:var(--orange);
color:#10100f;
}

.glazing-selector button:active,
.tint-selector button:active {
transform:scale(.985);
}

.glazed-label {
height:27px;
border:0 solid rgba(255,255,255,.12);
border-left-width:1px;
border-right-width:1px;
border-bottom-width:1px;
border-radius:0 0 16px 16px;
position:relative;
overflow:hidden;
background:#0a0b0b;
}

.glazed-label span {
position:absolute;
top:50%;
left:0;
width:50%;
text-align:center;
transform:translateY(-50%);
color:#a4a5a2;
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:9.2px;
font-weight:800;
line-height:1;
letter-spacing:1.4px;
text-transform:uppercase;
transition:left .28s ease;
}

.glazed-label.triple span {
left:50%;
}

.tint-wrap {
position:relative;
padding-bottom:0;
}

.tint-selector {
display:grid;
grid-template-columns:repeat(4,1fr);
border:1px solid rgba(255,255,255,.16);
border-radius:16px 16px 0 0;
overflow:hidden;
background:#090a0a;
}

.tint-selector button {
min-height:40px;
padding:0 4px;
font-size:9.2px;
letter-spacing:.9px;
}

.tint-selector button + button {
border-left:1px solid rgba(255,255,255,.10);
}

.tint-selector button.active {
background:#171919;
color:var(--orange-bright);
}

.tint-selector button[data-tint="clear"].active {
background:#171919;
color:var(--white);
}

.tint-selector button[data-tint="blue"].active {
background:
linear-gradient(
135deg,
rgba(48,156,224,.40) 0%,
rgba(84,187,242,.52) 52%,
rgba(118,207,250,.38) 100%
);
color:#f5fbff;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.10);
}

.tint-selector button[data-tint="grey"].active {
background:
linear-gradient(
135deg,
rgba(97,103,101,.35) 0%,
rgba(137,143,140,.46) 52%,
rgba(175,180,177,.30) 100%
);
color:#ffffff;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.08);
}

.tint-selector button[data-tint="satin"].active {
background:
linear-gradient(
135deg,
rgba(205,210,205,.28) 0%,
rgba(235,237,232,.42) 52%,
rgba(178,184,179,.30) 100%
);
color:#f7f7f3;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.12);
}

.tint-caption-track {
position:relative;
width:100%;
height:27px;
overflow:hidden;
border:0 solid rgba(255,255,255,.12);
border-left-width:1px;
border-right-width:1px;
border-bottom-width:1px;
border-radius:0 0 16px 16px;
background:#0a0b0b;
pointer-events:none;
}

.tint-caption {
position:absolute;
top:50%;
left:0;
width:25%;
display:flex;
align-items:center;
justify-content:center;
color:#9d9e9b;
font-family:
"Bahnschrift",
"Aptos",
sans-serif;
font-size:9.2px;
font-weight:800;
line-height:1;
letter-spacing:1.2px;
text-transform:uppercase;
opacity:0;
transform:translateY(-50%);
transition:
left .28s ease,
opacity .18s ease;
}

.tint-caption.visible {
opacity:1;
}

/* =========================================
RIGHT PRODUCT DETAILS
========================================= */

.product-details {
position:relative;
z-index:10;
min-width:0;
padding-left:clamp(22px,2.7vw,39px);

.product-title {

"Bahnschrift SemiCondensed",

"Arial Narrow",
sans-serif;
font-size:clamp(31px,3.4vw,48px);

letter-spacing:-1.6px;
font-weight:800;
color:var(--cream);
}

.estimated-delivery-card {

margin-top:clamp(14px,1.6vw,20px);

.estimated-delivery-card::after {

.estimated-delivery-label {

"Bahnschrift",
"Aptos",
sans-serif;

line-height:1;
letter-spacing:1.45px;
text-transform:uppercase;
white-space:nowrap;
}

.estimated-delivery-date {
display:block;
margin-top:7px;
max-width:100%;
color:var(--orange-bright);
font-family:
"Bahnschrift SemiCondensed",
"Aptos Display",
"Arial Narrow",
sans-serif;
