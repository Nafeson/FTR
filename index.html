<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Factory Toughened Rooflights | Frameless Flat Roof Skylights</title>

<meta
name="description"
content="British manufactured frameless flat roof skylights with toughened safety glass, a 20 year warranty, free mainland UK delivery on eligible sizes and postcode-based delivery pricing on Extra Large rooflights."
/>

<style>
:root {

/* =========================================
FACTORY TOUGHENED ROOFLIGHTS
WORKSHOP / DIRECT-ORDER DESIGN SYSTEM
========================================= */

--orange:#e87817;
--orange-bright:#f28a28;
--orange-soft:#b75a12;

--black:#090a0a;
--dark:#0d0f0f;
--dark-2:#111313;
--panel:#151818;
--panel-raised:#191c1c;

--graphite:#242828;
--graphite-light:#303535;

--steel:#9ca3a1;
--steel-light:#c9cecb;
--steel-dark:#686f6d;

--cream:#f1f0e9;
--white:#f7f7f3;
--muted:#b7bbb8;
--muted-soft:#8f9692;

--line:rgba(216,221,217,.14);
--line-strong:rgba(216,221,217,.24);

--navy:#17232a;

--workshop-green:#163c2d;
--workshop-green-mid:#1c4c39;
--workshop-green-bright:#286449;
--workshop-green-dark:#0c1e17;

--whatsapp:#25d366;

--gold:#b89a62;
--gold-light:#e1c98f;
--gold-dark:#6f5a34;

/* =========================================
COSMIC BLUE — TINTED PRODUCT RANGE
========================================= */

--tint-blue:#213c59;
--tint-blue-mid:#294d73;
--tint-blue-bright:#6f9dc8;
--tint-blue-light:#8ab2d5;
--tint-navy:#101b29;
--tint-cosmic:#14263b;
--tint-cosmic-deep:#0d1723;

--fast-red:#d85842;
}

* {
box-sizing:border-box;
}

html {
scroll-behavior:smooth;
}

body {
margin:0;
font-family:
"Aptos",
"Inter",
"Segoe UI",
Arial,
sans-serif;
background:var(--black);
color:var(--white);
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
}

img {
max-width:100%;
}

/* =========================================
TYPOGRAPHIC LANGUAGE
========================================= */

h1,
h2,
h3,
.wordmark,
.section-label,
.home-product-size,
.price,
.home-product-price {
font-family:
"Bahnschrift",
"Bahnschrift SemiCondensed",
"Arial Narrow",
"Aptos Display",
"Inter",
Arial,
sans-serif;
}

h1,
h2,
h3,
p {
position:relative;
z-index:1;
}

h2 {
color:var(--cream);
font-size:clamp(38px,5vw,64px);
line-height:.99;
letter-spacing:-1.45px;
font-weight:800;
margin:0 0 26px;
}

section p {
color:var(--muted);
line-height:1.68;
font-size:17px;
}

.section-label {
display:flex;
align-items:center;
gap:10px;
color:var(--orange);
font-size:10px;
font-weight:800;
letter-spacing:2.4px;
line-height:1;
text-transform:uppercase;
margin-bottom:18px;
}

.section-label::before {
content:"";
display:block;
width:28px;
height:1px;
background:var(--orange);
opacity:.85;
}

/* ===============================
TOP MOVING BANNER
================================ */

.top-banner {
background:#161918;
color:rgba(247,247,243,.72);
overflow:hidden;
white-space:nowrap;
border-bottom:1px solid rgba(255,255,255,.07);
font-family:
"Bahnschrift",
"Arial Narrow",
"Aptos",
Arial,
sans-serif;
font-size:8px;
font-weight:700;
letter-spacing:1.65px;
text-transform:uppercase;
}

.ticker {
display:inline-block;
padding:8px 0;
animation:ticker 52s linear infinite;
}

.ticker span {
margin-right:90px;
}

@keyframes ticker {
from {
transform:translateX(0);
}

to {
transform:translateX(-50%);
}
}

/* ===============================
HEADER
================================ */

header {
background:rgba(11,12,12,.965);
border-bottom:1px solid rgba(255,255,255,.09);
padding:24px 6% 20px;
display:grid;
grid-template-columns:1fr auto;
align-items:start;
gap:32px;
position:sticky;
top:0;
z-index:30;
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
box-shadow:0 8px 30px rgba(0,0,0,.16);
}

.wordmark-wrap {
display:grid;
gap:9px;
}

.wordmark {
line-height:.91;
font-weight:850;
letter-spacing:2.8px;
color:var(--cream);
font-size:24px;
text-transform:uppercase;
width:max-content;
}

.wordmark span {
color:var(--orange);
display:block;
}

.wordmark-bottom {
display:flex;
align-items:flex-end;
gap:0;
white-space:nowrap;
width:max-content;
}

.wordmark-domain {
color:var(--steel-light);
font-size:.40em;
font-weight:700;
letter-spacing:.15px;
line-height:1;
margin-left:1px;
padding-bottom:2px;
text-transform:lowercase;
}

.address-line {
font-size:12px;
line-height:1.45;
font-weight:600;
color:rgba(255,255,255,.72);
letter-spacing:.6px;
text-transform:uppercase;
}

.action-icons {
display:flex;
gap:8px;
align-self:end;
padding-bottom:1px;
}

.header-action-wrap {
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.action-icons button,
.action-icons a.header-icon-button {
width:42px;
height:42px;
border:1px solid rgba(230,233,230,.16);
background:#111313;
color:var(--steel-light);
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
font-weight:800;
cursor:pointer;
transition:
transform .22s ease,
border-color .22s ease,
color .22s ease,
background .22s ease,
box-shadow .22s ease;
line-height:1;
padding:0;
}

.action-icons button:hover,
.action-icons a.header-icon-button:hover {
border-color:rgba(232,120,23,.70);
color:var(--orange-bright);
background:#171817;
box-shadow:0 7px 22px rgba(0,0,0,.25);
transform:translateY(-1px);
}

.action-icons button.is-selected {
border-color:rgba(232,120,23,.85);
color:var(--orange-bright);
background:#191714;
box-shadow:
0 0 0 1px rgba(232,120,23,.08),
0 7px 22px rgba(0,0,0,.24);
}

/* ===============================
WHATSAPP EXPANDING ACTION
================================ */

.whatsapp-action {
position:absolute;
left:50%;
bottom:calc(100% + 15px);
z-index:85;
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:7px;
background:
linear-gradient(
145deg,
#36e676 0%,
#25d366 52%,
#179b46 100%
);
border:1px solid rgba(255,255,255,.30);
box-shadow:
0 15px 30px rgba(0,0,0,.55),
0 0 14px rgba(37,211,102,.18),
inset 0 1px 0 rgba(255,255,255,.30);
opacity:0;
visibility:hidden;
pointer-events:none;
transform:
translate(-50%,20px)
scale(.58);
transform-origin:center bottom;
transition:
opacity .2s ease,
visibility .2s ease,
transform .38s cubic-bezier(.18,.82,.28,1.35);
}

.whatsapp-action.is-open {
opacity:1;
visibility:visible;
pointer-events:auto;
transform:
translate(-50%,0)
scale(1);
animation:whatsappAttention 4s ease-in-out .9s infinite;
}

.whatsapp-action svg {
width:27px;
height:27px;
display:block;
fill:#ffffff;
filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));
}

.whatsapp-action:hover,
.whatsapp-action:active {
transform:
translate(-50%,-2px)
scale(1.04);
box-shadow:
0 18px 35px rgba(0,0,0,.62),
0 0 22px rgba(37,211,102,.38),
inset 0 1px 0 rgba(255,255,255,.38);
}

@keyframes whatsappAttention {
0%,
72%,
100% {
transform:
translate(-50%,0)
scale(1);
}

78% {
transform:
translate(-50%,-2px)
scale(1.045);
}

83% {
transform:
translate(-50%,0)
scale(.99);
}

88% {
transform:
translate(-50%,0)
scale(1);
}
}

/* ===============================
MINIMAL BASKET TOTAL
================================ */

.basket-total-text {
position:absolute;
top:-16px;
left:50%;
z-index:5;
font-family:
"Bahnschrift Condensed",
"Arial Narrow",
"Aptos",
sans-serif;
font-size:9px;
font-weight:800;
line-height:1;
letter-spacing:.3px;
color:var(--cream);
text-align:center;
white-space:nowrap;
text-shadow:0 2px 5px rgba(0,0,0,.92);
opacity:0;
transform:
translate(-50%,7px)
scale(.78);
transform-origin:center bottom;
pointer-events:none;
}

.basket-total-text.is-visible {
opacity:1;
transform:
translate(-50%,0)
scale(1);
transition:
opacity .22s ease,
transform .42s cubic-bezier(.18,.78,.28,1.35);
}

.basket-total-text.is-updating {
animation:basketTotalUpdate .52s cubic-bezier(.18,.78,.28,1.28);
}

@keyframes basketTotalUpdate {
0% {
opacity:1;
transform:
translate(-50%,0)
scale(1);
}

42% {
transform:
translate(-50%,-4px)
scale(1.12);
color:#f6dbc1;
}

72% {
transform:
translate(-50%,1px)
scale(.98);
}

100% {
opacity:1;
transform:
translate(-50%,0)
scale(1);
}
}

/* ===============================
STATIC LEAD-TIME BANNER
================================ */

.lead-time-banner {
position:relative;
overflow:hidden;
background:#111313;
border-top:0;
border-bottom:1px solid rgba(232,120,23,.28);
padding:11px 6%;
text-align:center;
}

.lead-time-inner {
position:relative;
max-width:1180px;
margin:0 auto;
display:grid;
justify-items:center;
}

.lead-time-main {
display:flex;
justify-content:center;
align-items:center;
gap:11px;
flex-wrap:wrap;
line-height:1;
}

.lead-time-van {
width:50px;
height:24px;
display:block;
flex:0 0 auto;
color:var(--steel-light);
filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
}

.lead-time-feature {
display:inline-flex;
align-items:baseline;
gap:5px;
font-family:
"Bahnschrift Condensed",
"Arial Narrow",
"Aptos",
sans-serif;
font-size:clamp(13px,1.5vw,18px);
font-weight:800;
letter-spacing:1.5px;
line-height:1;
text-transform:uppercase;
padding:3px 1px 4px;
}

.lead-time-fast {
color:var(--cream);
text-shadow:none;
}

.lead-time-red {
color:var(--orange);
text-shadow:none;
}

.lead-time-divider {
color:rgba(255,255,255,.22);
font-size:15px;
font-weight:400;
}

.lead-time-message {
position:relative;
display:inline-flex;
align-items:flex-start;
font-family:
"Bahnschrift",
"Aptos",
"Segoe UI",
Arial,
sans-serif;
font-size:clamp(11px,1.35vw,15px);
font-weight:700;
letter-spacing:1px;
line-height:1.15;
text-transform:uppercase;
color:rgba(247,247,243,.82);
white-space:nowrap;
text-shadow:none;
}

.lead-time-message-text {
position:relative;
display:inline-block;
overflow:hidden;
}

.lead-time-message-text::after {
content:attr(data-text);
position:absolute;
inset:0;
z-index:2;
color:transparent;
background:
linear-gradient(
112deg,
transparent 0%,
transparent 42%,
rgba(255,255,255,.08) 46%,
rgba(255,255,255,.62) 50%,
rgba(255,255,255,.08) 54%,
transparent 60%,
transparent 100%
);
background-size:245% 100%;
background-position:165% 0;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
animation:glassTextReflection 9s ease-in-out 3s infinite;
pointer-events:none;
}

.lead-time-star {
position:relative;
display:inline-block;
margin-left:1px;
font-size:.92em;
line-height:.8;
transform-origin:center;
animation:leadStarGlint 9s ease-in-out 3s infinite;
}

.lead-time-star::before,
.lead-time-star::after {
content:"";
position:absolute;
left:50%;
top:43%;
z-index:-1;
width:17px;
height:1px;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.80),
transparent
);
opacity:0;
transform:translate(-50%,-50%);
animation:leadStarRays 9s ease-in-out 3s infinite;
pointer-events:none;
}

.lead-time-star::after {
transform:
translate(-50%,-50%)
rotate(90deg);
}

@keyframes glassTextReflection {
0%,
2% {
background-position:165% 0;
opacity:0;
}

3% {
opacity:.20;
}

11% {
background-position:-75% 0;
opacity:.85;
}

14%,
100% {
background-position:-75% 0;
opacity:0;
}
}

@keyframes leadStarGlint {
0%,
9%,
16%,
100% {
color:var(--cream);
text-shadow:none;
transform:scale(1);
}

11% {
color:#fff4e8;
text-shadow:
0 0 4px rgba(255,255,255,.55),
0 0 10px rgba(232,120,23,.30);
transform:scale(1.16);
}

13% {
color:var(--cream);
transform:scale(1.05);
}
}

@keyframes leadStarRays {
0%,
9%,
16%,
100% {
opacity:0;
width:5px;
}

11% {
opacity:.75;
width:18px;
}

13% {
opacity:.25;
width:13px;
}
}

/* ===============================
MENU
================================ */

.menu-overlay {
position:fixed;
inset:0;
background:rgba(10,11,11,.992);
z-index:100;
display:none;
padding:55px 6%;
overflow-y:auto;
}

.menu-overlay.active {
display:block;
}

.menu-top {
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:60px;
}

.close-menu {
background:#111313;
color:var(--cream);
border:1px solid rgba(255,255,255,.16);
width:44px;
height:44px;
font-size:26px;
cursor:pointer;
}

.menu-links {
display:grid;
gap:0;
max-width:760px;
border-top:1px solid rgba(255,255,255,.10);
}

.menu-links a {
color:var(--cream);
text-decoration:none;
font-family:
"Bahnschrift SemiCondensed",
"Arial Narrow",
"Aptos Display",
sans-serif;
font-size:clamp(31px,5vw,62px);
font-weight:750;
line-height:1;
letter-spacing:-1.2px;
text-transform:uppercase;
border-bottom:1px solid rgba(255,255,255,.10);
padding:22px 0;
transition:
color .2s ease,
padding-left .2s ease,
background .2s ease;
}

.menu-links a:hover {
color:var(--orange-bright);
padding-left:10px;
}

/* ===============================
SCROLL REVEALS
================================ */

.reveal {
opacity:0;
transform:translateY(28px);
transition:
opacity .75s ease,
transform .75s cubic-bezier(.18,.72,.28,1);
will-change:opacity,transform;
}

.reveal.reveal-left {
transform:translateX(-34px);
}

.reveal.reveal-right {
transform:translateX(34px);
}

.reveal.reveal-scale {
transform:translateY(18px) scale(.985);
}

.reveal.is-visible {
opacity:1;
transform:translate(0,0) scale(1);
}

.reveal-delay-1 {
transition-delay:.07s;
}

.reveal-delay-2 {
transition-delay:.14s;
}

.reveal-delay-3 {
transition-delay:.21s;
}

.reveal-delay-4 {
transition-delay:.28s;
}

.direct-copy > p.reveal {
opacity:1;
transform:none;
transition:none;
will-change:auto;
}

/* ===============================
POPULAR SIZES
ORDER DESK / PRODUCT FIRST
================================ */

.home-popular-section {
position:relative;
overflow:hidden;
padding:38px 6% 54px;
background:
linear-gradient(
180deg,
#111313 0%,
#0d0f0f 100%
);
border-top:0;
border-bottom:1px solid rgba(255,255,255,.09);
}

.home-popular-section::before {
content:"";
position:absolute;
top:0;
right:0;
width:38%;
height:100%;
background:
linear-gradient(
90deg,
transparent 0%,
rgba(255,255,255,.013) 100%
);
pointer-events:none;
}

.home-popular-section::after {
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(
rgba(255,255,255,.018) 1px,
transparent 1px
),
linear-gradient(
90deg,
rgba(255,255,255,.018) 1px,
transparent 1px
);
background-size:48px 48px;
opacity:.45;
pointer-events:none;
}

.home-popular-title-wrap,
.home-popular-grid,
.home-popular-footer,
.mobile-feature-icons {
position:relative;
z-index:2;
}

.home-popular-title-wrap {
max-width:1180px;
margin:0 auto 28px;
padding-bottom:19px;
border-bottom:1px solid rgba(255,255,255,.10);
}

.home-opening-title {
margin:0;
font-family:
"Bahnschrift",
"Arial Narrow",
"Aptos",
sans-serif;
font-size:11px;
line-height:1;
letter-spacing:2.35px;
font-weight:700;
text-transform:uppercase;
color:var(--steel);
}

.home-opening-title span {
display:block;
margin-top:8px;
font-family:
"Bahnschrift SemiCondensed",
"Aptos Display",
"Inter",
Arial,
sans-serif;
font-size:clamp(32px,4.8vw,58px);
line-height:.98;
letter-spacing:-1.35px;
font-weight:800;
color:var(--cream);
text-transform:none;
}

.home-popular-grid {
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:14px;
max-width:1180px;
margin:0 auto;
width:100%;
}

.home-product-card {
display:grid;
grid-template-columns:150px minmax(0,1fr);
gap:17px;
background:#151717;
border:1px solid rgba(233,236,233,.11);
padding:12px;
min-height:185px;
position:relative;
overflow:hidden;
isolation:isolate;
--home-image-transform:none;
--home-image-hover-transform:scale(1.025);
transition:
transform .22s ease,
border-color .22s ease,
box-shadow .22s ease,
background .22s ease;
}

.home-product-card::before {
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:2px;
z-index:2;
background:var(--orange);
opacity:0;
transform:scaleY(.2);
transition:
opacity .25s ease,
transform .25s ease;
pointer-events:none;
}

.home-product-card:hover::before,
.home-product-card:active::before {
opacity:1;
transform:scaleY(1);
}

.home-product-card:hover,
.home-product-card:active {
transform:translateY(-3px);
border-color:rgba(232,120,23,.36);
background:#191b1b;
box-shadow:
0 20px 38px rgba(0,0,0,.28);
z-index:4;
}

.home-product-image {
position:relative;
z-index:1;
width:100%;
height:148px;
background:#ffffff;
border:0;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.home-product-image img {
width:100%;
height:100%;
object-fit:contain;
object-position:center center;
display:block;
background:#ffffff;
transform:var(--home-image-transform);
transform-origin:center center;
transition:
transform .28s ease,
filter .28s ease;
}

.home-product-card:hover .home-product-image img,
.home-product-card:active .home-product-image img {
transform:var(--home-image-hover-transform);
filter:contrast(1.015);
}

.home-product-card.image-size-400x800 .home-product-image img,
.home-product-card.image-size-600x900 .home-product-image img {
object-fit:cover;
object-position:center center;
}

.home-product-card.image-size-300x1500,
.home-product-card.image-size-400x1500,
.home-product-card.image-size-400x1800 {
--home-image-transform:rotate(90deg) scale(1.30);
--home-image-hover-transform:rotate(90deg) scale(1.33);
}

/* =========================================
POPULAR SIZE PRODUCT IMAGE RESCALING
========================================= */

.home-popular-section .home-product-card.image-size-600x900 {
--home-image-transform:scale(.80);
--home-image-hover-transform:scale(.82);
}

.home-popular-section .home-product-card.image-size-400x1500 {
--home-image-transform:rotate(90deg) scale(1.50);
--home-image-hover-transform:rotate(90deg) scale(1.53);
}

.home-popular-section .home-product-card.image-size-1000x1200 {
--home-image-transform:scale(1.15);
--home-image-hover-transform:scale(1.18);
}

.home-product-content {
position:relative;
z-index:1;
display:flex;
flex-direction:column;
min-width:0;
}

.home-product-size {
font-size:25px;
line-height:1;
font-weight:800;
letter-spacing:-.8px;
margin-bottom:9px;
color:var(--cream);
transition:color .22s ease;
}

.home-product-card:hover .home-product-size {
color:var(--orange-bright);
transform:none;
}

/* ===============================
PRODUCT SPECIFICATION LINES
================================ */

.home-product-spec {
display:grid;
gap:5px;
color:var(--muted-soft);
font-size:11px;
line-height:1.35;
margin-bottom:11px;
}

.home-product-spec span {
display:block;
}

.home-product-spec span:first-child,
.home-product-spec .product-internal-size {
color:rgba(247,247,243,.72);
}

.home-product-spec .product-glass-spec,
.product-glass-spec {
color:var(--muted);
}

.home-product-spec .delivery-free {
color:rgba(247,247,243,.76);

/* ===============================
RANGE CTA
================================ */

.range-cta-button {
position:relative;
overflow:hidden;

gap:9px;

animation:rangeCtaGuide 7s ease-in-out infinite;
}

.range-cta-button::before {
content:"";
position:absolute;
z-index:-1;
top:-30%;
bottom:-30%;
left:-42%;
width:22%;
background:
linear-gradient(
112deg,
transparent 0%,
rgba(255,255,255,.03) 30%,
rgba(255,255,255,.23) 50%,
rgba(255,255,255,.03) 70%,
transparent 100%
);
transform:skewX(-18deg);
animation:rangeCtaSweep 7s ease-in-out infinite;
pointer-events:none;
}

.range-cta-button::after {
content:"→";
display:inline-block;
font-size:1.1em;
line-height:1;
font-weight:800;
transform:translateX(0);
animation:rangeCtaArrow 7s ease-in-out infinite;
}

@keyframes rangeCtaGuide {
0%,
72%,
100% {
box-shadow:none;
}

82% {
box-shadow:0 0 0 1px rgba(232,120,23,.08);
}
}

@keyframes rangeCtaSweep {
0%,
70% {
left:-42%;
opacity:0;
}

74% {
opacity:.12;
}

84% {
left:120%;
opacity:.7;
}

88%,
100% {
left:120%;
opacity:0;
}
}

@keyframes rangeCtaArrow {
0%,
73%,
100% {
transform:translateX(0);
}

80% {
transform:translateX(4px);
}

85% {
transform:translateX(1px);
}

90% {
transform:translateX(4px);
}
}
