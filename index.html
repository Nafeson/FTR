<script>

/* ===============================
MENU
================================ */

function openMenu() {
closeWhatsAppAction();

const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (menuOverlay) {
menuOverlay.classList.add(
"active"
);
}

document.body.style.overflow =
"hidden";
}

function closeMenu() {
const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (menuOverlay) {
menuOverlay.classList.remove(
"active"
);
}

document.body.style.overflow =
"";
}


/* ===============================
WHATSAPP EXPANDING ACTION
================================ */

const whatsappButton =
document.getElementById(
"whatsappButton"
);

const whatsappAction =
document.getElementById(
"whatsappAction"
);

function setWhatsAppState(
shouldOpen
) {

if (
!whatsappButton ||
!whatsappAction
) {
return;
}

whatsappButton.classList.toggle(
"is-selected",
shouldOpen
);

whatsappAction.classList.toggle(
"is-open",
shouldOpen
);

whatsappButton.setAttribute(
"aria-expanded",
String(shouldOpen)
);

}

function closeWhatsAppAction() {
setWhatsAppState(
false
);
}

function toggleWhatsAppAction() {

if (
!whatsappAction
) {
return;
}

const isOpen =
whatsappAction.classList.contains(
"is-open"
);

setWhatsAppState(
!isOpen
);

}

if (
whatsappButton &&
whatsappAction
) {

whatsappButton.addEventListener(
"click",
event => {

event.stopPropagation();

toggleWhatsAppAction();

}
);

whatsappAction.addEventListener(
"click",
event => {

event.stopPropagation();

}
);

}

document.addEventListener(
"click",
closeWhatsAppAction
);

document.addEventListener(
"keydown",
event => {

if (
event.key === "Escape"
) {

closeWhatsAppAction();

closeMenu();

}

}
);


/* ===============================
BASKET TOTAL DISPLAY
================================ */

const basketTotalText =
document.getElementById(
"basketTotalText"
);

let basketAnimationTimer =
null;

function animateBasketTotal() {

if (
!basketTotalText
) {
return;
}

basketTotalText.classList.add(
"is-visible"
);

basketTotalText.classList.remove(
"is-updating"
);

void basketTotalText.offsetWidth;

basketTotalText.classList.add(
"is-updating"
);

if (
basketAnimationTimer !== null
) {

window.clearTimeout(
basketAnimationTimer
);

}

basketAnimationTimer =
window.setTimeout(
() => {

basketTotalText.classList.remove(
"is-updating"
);

},
560
);

}

function updateBasketTotal(
total
) {

const safeTotal =
Number.isFinite(
Number(
total
)
)
? Number(
total
)
: 0;

const formattedTotal =
new Intl.NumberFormat(
"en-GB",
{
style:"currency",
currency:"GBP"
}
).format(
safeTotal
);

if (
basketTotalText
) {

basketTotalText.textContent =
formattedTotal;

basketTotalText.setAttribute(
"aria-label",
"Basket total " +
formattedTotal
);

animateBasketTotal();

}

}

window.setTimeout(
() => {

updateBasketTotal(
0
);

},
2000
);


/* ===============================
MOTION PREFERENCE
================================ */

const reducedMotionQuery =
window.matchMedia(
"(prefers-reduced-motion: reduce)"
);


/* ===============================
STANDARD SCROLL REVEALS
================================ */

const revealElements =
Array.from(
document.querySelectorAll(
".reveal, .direct-image-reveal"
)
);

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

revealElements.forEach(
element => {

element.classList.add(
"is-visible"
);

}
);

} else {

const revealObserver =
new IntersectionObserver(
entries => {

entries.forEach(
entry => {

if (
!entry.isIntersecting
) {
return;
}

entry.target.classList.add(
"is-visible"
);

revealObserver.unobserve(
entry.target
);

}
);

},
{
threshold:.14,
rootMargin:"0px 0px -7% 0px"
}
);

revealElements.forEach(
element => {

revealObserver.observe(
element
);

}
);

}


/* ===============================
STANDARD + TINTED PRODUCT CARDS
================================ */

const homepageProductCards =
Array.from(
document.querySelectorAll(
".home-product-card"
)
);

let activeHomepageProductCard =
null;

function stopHomepageProductAttention() {

homepageProductCards.forEach(
card => {

card.classList.remove(
"is-selected"
);

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.classList.remove(
"is-encouraged"
);

}

}
);

activeHomepageProductCard =
null;

}

function activateHomepageProductCard(
card
) {

if (
!card
) {
return;
}

if (
activeHomepageProductCard &&
activeHomepageProductCard !== card
) {

stopHomepageProductAttention();

}

activeHomepageProductCard =
card;

card.classList.add(
"is-selected"
);

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.classList.remove(
"is-encouraged"
);

void productLink.offsetWidth;

productLink.classList.add(
"is-encouraged"
);

}

}

homepageProductCards.forEach(
card => {

card.addEventListener(
"click",
event => {

const clickedLink =
event.target.closest(
".home-product-link"
);

if (
clickedLink
) {
return;
}

event.stopPropagation();

activateHomepageProductCard(
card
);

}
);

card.addEventListener(
"keydown",
event => {

if (
event.key !== "Enter" &&
event.key !== " "
) {
return;
}

if (
event.target.closest(
"button, a, input, select"
)
) {
return;
}

event.preventDefault();

event.stopPropagation();

activateHomepageProductCard(
card
);

}
);

}
);

document.addEventListener(
"click",
event => {

if (
event.target.closest(
".home-product-card"
)
) {
return;
}

stopHomepageProductAttention();

}
);


/* ===============================
MOBILE FEATURE ICON SHIMMER
================================ */

const mobileFeatureIcons =
document.getElementById(
"mobileFeatureIcons"
);

if (
mobileFeatureIcons
) {

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

mobileFeatureIcons.classList.add(
"icon-shimmer-active"
);

} else {

const mobileFeatureObserver =
new IntersectionObserver(
entries => {

entries.forEach(
entry => {

if (
!entry.isIntersecting
) {
return;
}

entry.target.classList.add(
"icon-shimmer-active"
);

mobileFeatureObserver.unobserve(
entry.target
);

}
);

},
{
threshold:.45,
rootMargin:"0px 0px -6% 0px"
}
);

mobileFeatureObserver.observe(
mobileFeatureIcons
);

}

}


/* ===============================
ENGINEERED CARD FULL-VIEW SHIMMERS
================================ */

const engineeredItems =
Array.from(
document.querySelectorAll(
".engineered-card"
)
);

let engineeredShimmerFrame =
null;

function getVisiblePageTop() {

const pageHeader =
document.querySelector(
"header"
);

if (
!pageHeader
) {
return 0;
}

return Math.max(
0,
pageHeader
.getBoundingClientRect()
.bottom
);

}

function checkEngineeredCardShimmers() {

engineeredShimmerFrame =
null;

if (
reducedMotionQuery.matches ||
engineeredItems.length === 0
) {
return;
}

const visibleTop =
getVisiblePageTop();

const visibleBottom =
window.innerHeight - 8;

engineeredItems.forEach(
item => {

if (
item.dataset.shimmerPlayed ===
"true"
) {
return;
}

const itemRect =
item.getBoundingClientRect();

const isFullyVisible =
itemRect.top >= visibleTop &&
itemRect.bottom <= visibleBottom;

if (
!isFullyVisible
) {
return;
}

item.dataset.shimmerPlayed =
"true";

item.classList.add(
"shimmer-play"
);

}
);

}

function requestEngineeredShimmerCheck() {

if (
engineeredShimmerFrame !== null
) {
return;
}

engineeredShimmerFrame =
window.requestAnimationFrame(
checkEngineeredCardShimmers
);

}

if (
reducedMotionQuery.matches
) {

engineeredItems.forEach(
item => {

item.dataset.shimmerPlayed =
"true";

}
);

} else {

window.addEventListener(
"scroll",
requestEngineeredShimmerCheck,
{
passive:true
}
);

window.addEventListener(
"resize",
requestEngineeredShimmerCheck
);

window.addEventListener(
"load",
requestEngineeredShimmerCheck
);

requestEngineeredShimmerCheck();

}


/* ===============================
CUSTOM BUILD ELEMENT REFERENCES
================================ */

const calculatorWrap =
document.getElementById(
"calculator"
);

const homepageCalculator =
document.getElementById(
"homepageCalculator"
);

const existingOpeningRooflightVisual =
document.querySelector(
".existing-opening-rooflight-visual"
);

let existingOpeningRooflightRevealed =
false;

let customBuildPairRevealed =
false;


/* ===============================
SYNCHRONISED CUSTOM ROOFLIGHT +
BUILDER REVEAL

The custom product visual and the
Build A Custom Rooflight interface
appear together as one order stage.
================================ */

function revealExistingOpeningRooflight() {

if (
!existingOpeningRooflightVisual ||
existingOpeningRooflightRevealed
) {
return;
}

existingOpeningRooflightRevealed =
true;

existingOpeningRooflightVisual.classList.add(
"is-revealed"
);

const rooflightRevealElements =
Array.from(
existingOpeningRooflightVisual.querySelectorAll(
".reveal"
)
);

rooflightRevealElements.forEach(
element => {

element.classList.add(
"is-visible"
);

}
);

}

function revealHomepageCalculator() {

if (
!homepageCalculator
) {
return;
}

homepageCalculator.classList.add(
"is-visible"
);

const calculatorRevealElements =
Array.from(
homepageCalculator.querySelectorAll(
".reveal"
)
);

calculatorRevealElements.forEach(
element => {

element.classList.add(
"is-visible"
);

}
);

}

function revealCustomBuildPair() {

if (
customBuildPairRevealed
) {
return;
}

customBuildPairRevealed =
true;

revealExistingOpeningRooflight();

revealHomepageCalculator();

}

if (
calculatorWrap &&
homepageCalculator &&
existingOpeningRooflightVisual
) {

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

revealCustomBuildPair();

} else {

const customBuildPairObserver =
new IntersectionObserver(
entries => {

entries.forEach(
entry => {

if (
!entry.isIntersecting
) {
return;
}

revealCustomBuildPair();

customBuildPairObserver.unobserve(
entry.target
);

}
);

},
{
threshold:.04,
rootMargin:"0px 0px -2% 0px"
}
);

customBuildPairObserver.observe(
calculatorWrap
);

}

} else {

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

revealHomepageCalculator();

revealExistingOpeningRooflight();

}

}


/* ===============================
STANDARD + TINTED GLAZING CONTROLS
================================ */

function formatProductPrice(
selectedPrice
) {

const normalizedPrice =
String(
selectedPrice ?? ""
)
.trim();

if (
normalizedPrice === "" ||
normalizedPrice.toUpperCase() ===
"TBC"
) {

return "£TBC";

}

if (
normalizedPrice.startsWith(
"£"
)
) {

return normalizedPrice;

}

return "£" +
normalizedPrice;

}

homepageProductCards.forEach(
card => {

const glazingButtons =
Array.from(
card.querySelectorAll(
".home-glazing-toggle button"
)
);

const priceElement =
card.querySelector(
".home-product-price"
);

const glazedLabel =
card.querySelector(
".home-glazed-label"
);

glazingButtons.forEach(
button => {

button.addEventListener(
"click",
event => {

event.stopPropagation();

activateHomepageProductCard(
card
);

const glazing =
button.dataset.glazing;

glazingButtons.forEach(
item => {

item.classList.toggle(
"active",
item === button
);

}
);

const selectedPrice =
glazing === "triple"
? card.dataset.triplePrice
: card.dataset.doublePrice;

if (
priceElement
) {

priceElement.innerHTML =
`${formatProductPrice(selectedPrice)}<span class="home-vat-note">inc. vat</span>`;

}

if (
glazedLabel
) {

glazedLabel.classList.toggle(
"triple",
glazing === "triple"
);

}

}
);

}
);

}
);


/* ===============================
EXISTING OPENING ASSISTANT
================================ */

const existingOpeningAssistant =
document.getElementById(
"existingOpeningAssistant"
);

const openingInternalWidth =
document.getElementById(
"openingInternalWidth"
);

const openingInternalLength =
document.getElementById(
"openingInternalLength"
);

const openingInternalError =
document.getElementById(
"openingInternalError"
);

const openingInternalRecommendation =
document.getElementById(
"openingInternalRecommendation"
);

const recommendedInternalSize =
document.getElementById(
"recommendedInternalSize"
);


/* ===============================
GENERIC NUMBER INPUT HELPER
================================ */

function getNumericInputValue(
input
) {

if (
!input
) {
return null;
}

const rawValue =
String(
input.value
)
.trim();

if (
rawValue === ""
) {
return null;
}

const numericValue =
Number(
rawValue
);

if (
!Number.isFinite(
numericValue
)
) {
return null;
}

return numericValue;

}


/* ===============================
OPENING ASSISTANT ERROR STATE
================================ */

function hideOpeningError() {

if (
!openingInternalError
) {
return;
}

openingInternalError.textContent =
"";

openingInternalError.hidden =
true;

openingInternalError.classList.remove(
"is-visible"
);

openingInternalError.setAttribute(
"aria-hidden",
"true"
);

}

function showOpeningError(
message
) {

if (
!openingInternalError
) {
return;
}

openingInternalError.textContent =
message;

openingInternalError.hidden =
false;

openingInternalError.classList.add(
"is-visible"
);

openingInternalError.setAttribute(
"aria-hidden",
"false"
);

}


/* ===============================
OPENING ASSISTANT RECOMMENDATION
================================ */

function hideOpeningRecommendation() {

if (
recommendedInternalSize
) {

recommendedInternalSize.textContent =
"";

}

if (
!openingInternalRecommendation
) {
return;
}

openingInternalRecommendation.hidden =
true;

openingInternalRecommendation.classList.remove(
"is-visible"
);

openingInternalRecommendation.setAttribute(
"aria-hidden",
"true"
);

}

function showOpeningRecommendation(
recommendedWidth,
recommendedLength
) {

if (
recommendedInternalSize
) {

recommendedInternalSize.textContent =
`${recommendedWidth}mm × ${recommendedLength}mm`;

}

if (
openingInternalRecommendation
) {

openingInternalRecommendation.hidden =
false;

openingInternalRecommendation.classList.add(
"is-visible"
);

openingInternalRecommendation.setAttribute(
"aria-hidden",
"false"
);

}

/*
The opening assistant only calculates the
recommended internal rooflight size.

The custom rooflight visual and builder
continue to be controlled by the shared
scroll reveal above.
*/

}


/* ===============================
OPENING DIMENSION CALCULATION
================================ */

function validateInternalOpening() {

if (
!openingInternalWidth ||
!openingInternalLength
) {
return false;
}

const internalWidth =
getNumericInputValue(
openingInternalWidth
);

const internalLength =
getNumericInputValue(
openingInternalLength
);

hideOpeningError();

hideOpeningRecommendation();

if (
internalWidth === null &&
internalLength === null
) {
return false;
}

if (
internalWidth === null ||
internalLength === null
) {
return false;
}

if (
internalWidth < 310 ||
internalWidth > 1510
) {

showOpeningError(
"Please enter a maximum opening width between 310mm and 1510mm."
);

return false;

}

if (
internalLength < 310 ||
internalLength > 3010
) {

showOpeningError(
"Please enter a maximum opening length between 310mm and 3010mm."
);

return false;

}

const recommendedWidth =
Math.round(
internalWidth - 10
);

const recommendedLength =
Math.round(
internalLength - 10
);

if (
recommendedWidth < 300 ||
recommendedWidth > 1500 ||
recommendedLength < 300 ||
recommendedLength > 3000
) {

showOpeningError(
"These measurements are incompatible with the available rooflight size range."
);

return false;

}

showOpeningRecommendation(
recommendedWidth,
recommendedLength
);

return true;

}

if (
existingOpeningAssistant &&
openingInternalWidth &&
openingInternalLength
) {

openingInternalWidth.addEventListener(
"input",
validateInternalOpening
);

openingInternalLength.addEventListener(
"input",
validateInternalOpening
);

openingInternalWidth.addEventListener(
"change",
validateInternalOpening
);

openingInternalLength.addEventListener(
"change",
validateInternalOpening
);

hideOpeningError();

hideOpeningRecommendation();

}


/* ===============================
CUSTOM ROOFLIGHT BUILDER
================================ */

const customWidthInput =
document.getElementById(
"width"
);

const customLengthInput =
document.getElementById(
"length"
);

const customBorderInput =
document.getElementById(
"border"
);

const customGlazingInput =
document.getElementById(
"glazing"
);

const customFinishInput =
document.getElementById(
"finish"
);

const customPriceOutput =
document.getElementById(
"price"
);

const customPriceBox =
document.getElementById(
"customPriceBox"
);

const customPriceInternal =
document.getElementById(
"customPriceInternal"
);

const customPriceExternal =
document.getElementById(
"customPriceExternal"
);

const calculatorSizeAlert =
document.getElementById(
"calculatorSizeAlert"
);

const estimatedDeliveryDate =
document.getElementById(
"estimatedDeliveryDate"
);

const addCustomRooflightToOrder =
document.getElementById(
"addCustomRooflightToOrder"
);


/* ===============================
ONLINE SIZE LIMIT MESSAGE
================================ */

function setCalculatorSizeAlert(
shouldShow
) {

if (
!calculatorSizeAlert
) {
return;
}

calculatorSizeAlert.hidden =
!shouldShow;

}


/* ===============================
CUSTOM PRICE VISIBILITY
================================ */

function hideCustomPriceBox() {

if (
!customPriceBox
) {
return;
}

customPriceBox.hidden =
true;

}

function showCustomPriceBox() {

if (
!customPriceBox
) {
return;
}

customPriceBox.hidden =
false;

}


/* ===============================
CUSTOM BORDER
================================ */

function getCustomBorderSize() {

if (
!customBorderInput
) {
return 100;
}

const selectedBorder =
Number(
customBorderInput.value
);

if (
selectedBorder === 125 ||
selectedBorder === 150
) {

return selectedBorder;

}

return 100;

}


/* ===============================
DIMENSION FORMATTING
================================ */

function formatRooflightDimension(
value
) {

const numericValue =
Number(
value
);

if (
!Number.isFinite(
numericValue
)
) {
return "";
}

return new Intl.NumberFormat(
"en-GB",
{
maximumFractionDigits:1
}
).format(
numericValue
);

}


/* ===============================
WORKING-DAY DATE HELPER
================================ */

function addWorkingDays(
numberOfWorkingDays
) {

const deliveryDate =
new Date();

deliveryDate.setHours(
12,
0,
0,
0
);

let workingDaysRemaining =
Number(
numberOfWorkingDays
);

while (
workingDaysRemaining > 0
) {

deliveryDate.setDate(
deliveryDate.getDate() + 1
);

const dayOfWeek =
deliveryDate.getDay();

if (
dayOfWeek !== 0 &&
dayOfWeek !== 6
) {

workingDaysRemaining -=
1;

}

}

return deliveryDate;

}


/* ===============================
ESTIMATED PRODUCTION LEAD TIME

CLEAR
Up to 1000 × 2500:
4–6 working days

Larger:
6–8 working days

BLUE / GREY / SATIN
Up to 1000 × 2500:
6–8 working days

Larger:
8–10 working days
================================ */

function getCustomLeadTime(
width,
length,
finish
) {

const normalizedFinish =
String(
finish ?? ""
)
.trim()
.toLowerCase();

const isClear =
normalizedFinish === "clear";

const isStandardLeadTimeSize =
width <= 1000 &&
length <= 2500;

if (
isClear &&
isStandardLeadTimeSize
) {

return {
minimum:4,
maximum:6,
label:"Estimated 4–6 working days"
};

}

if (
isClear &&
!isStandardLeadTimeSize
) {

return {
minimum:6,
maximum:8,
label:"Estimated 6–8 working days"
};

}

if (
!isClear &&
isStandardLeadTimeSize
) {

return {
minimum:6,
maximum:8,
label:"Estimated 6–8 working days"
};

}

return {
minimum:8,
maximum:10,
label:"Estimated 8–10 working days"
};

}


/* ===============================
ESTIMATED DELIVERY DATE

The upper end of the estimated production
range is used for the displayed date.
================================ */

function getEstimatedDeliveryDate(
workingDays
) {

const deliveryDate =
addWorkingDays(
workingDays
);

return new Intl.DateTimeFormat(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
}
).format(
deliveryDate
);

}

function updateEstimatedDeliveryDate(
workingDays = 6
) {

if (
!estimatedDeliveryDate
) {
return;
}

estimatedDeliveryDate.textContent =
getEstimatedDeliveryDate(
workingDays
);

}


/* ===============================
CUSTOM ROOFLIGHT PRICE
================================ */

function calculatePrice() {

if (
!customWidthInput ||
!customLengthInput ||
!customBorderInput ||
!customGlazingInput ||
!customFinishInput ||
!customPriceOutput ||
!customPriceBox ||
!customPriceInternal ||
!customPriceExternal
) {
return;
}

const width =
getNumericInputValue(
customWidthInput
);

const length =
getNumericInputValue(
customLengthInput
);


/* ===============================
ONLINE MAXIMUM

1500mm internal width
2500mm internal length
================================ */

const widthAboveMaximum =
width !== null &&
width > 1500;

const lengthAboveMaximum =
length !== null &&
length > 2500;

const exceedsOnlineMaximum =
widthAboveMaximum ||
lengthAboveMaximum;

setCalculatorSizeAlert(
exceedsOnlineMaximum
);


/* ===============================
VALID ONLINE DIMENSIONS
================================ */

const dimensionsComplete =
width !== null &&
length !== null;

const dimensionsValid =
dimensionsComplete &&
width >= 300 &&
width <= 1500 &&
length >= 300 &&
length <= 2500;

if (
!dimensionsValid
) {

hideCustomPriceBox();

return;

}


/* ===============================
SELECTED SPECIFICATION
================================ */

const glazing =
customGlazingInput.value;

const finish =
customFinishInput.value;

const border =
getCustomBorderSize();


/* ===============================
INTERNAL + EXTERNAL SIZE
================================ */

const externalWidth =
width +
(
border * 2
);

const externalLength =
length +
(
border * 2
);

const area =
(
width * length
) /
1000000;


/* ===============================
CURRENT ONLINE PRICING LOGIC
================================ */

const baseRate =
glazing === "double"
? 290
: 375;

let price =
area *
baseRate;

const normalizedFinish =
String(
finish
)
.trim()
.toLowerCase();

if (
normalizedFinish !== "clear"
) {

price +=
area * 45;

}

price +=
90;


/* ===============================
MINIMUM ONLINE PRICES
================================ */

if (
price < 250 &&
glazing === "double"
) {

price =
250;

}

if (
price < 300 &&
glazing === "triple"
) {

price =
300;

}

const roundedPrice =
Math.round(
price
);


/* ===============================
LEAD TIME + DELIVERY ESTIMATE
================================ */

const leadTime =
getCustomLeadTime(
width,
length,
finish
);

updateEstimatedDeliveryDate(
leadTime.maximum
);


/* ===============================
DISPLAY PRICE
================================ */

customPriceOutput.textContent =
"£" +
roundedPrice;

customPriceInternal.textContent =
`${formatRooflightDimension(width)}mm × ${formatRooflightDimension(length)}mm`;

customPriceExternal.textContent =
`${formatRooflightDimension(externalWidth)}mm × ${formatRooflightDimension(externalLength)}mm`;


/* ===============================
STORE CURRENT CONFIGURATION
================================ */

if (
addCustomRooflightToOrder
) {

addCustomRooflightToOrder.dataset.price =
String(
roundedPrice
);

addCustomRooflightToOrder.dataset.internalWidth =
String(
width
);

addCustomRooflightToOrder.dataset.internalLength =
String(
length
);

addCustomRooflightToOrder.dataset.externalWidth =
String(
externalWidth
);

addCustomRooflightToOrder.dataset.externalLength =
String(
externalLength
);

addCustomRooflightToOrder.dataset.border =
String(
border
);

addCustomRooflightToOrder.dataset.glazing =
glazing;

addCustomRooflightToOrder.dataset.finish =
finish;

addCustomRooflightToOrder.dataset.leadTimeMinimum =
String(
leadTime.minimum
);

addCustomRooflightToOrder.dataset.leadTimeMaximum =
String(
leadTime.maximum
);

addCustomRooflightToOrder.dataset.leadTimeLabel =
leadTime.label;

}

showCustomPriceBox();

}


/* ===============================
CUSTOM BUILDER INPUT EVENTS
================================ */

[
customWidthInput,
customLengthInput,
customBorderInput,
customGlazingInput,
customFinishInput
]
.forEach(
element => {

if (
!element
) {
return;
}

element.addEventListener(
"input",
calculatePrice
);

element.addEventListener(
"change",
calculatePrice
);

}
);


/* ===============================
ADD TO ORDER PLACEHOLDER

Basket/order storage will connect here
when the checkout stage is added.
================================ */

if (
addCustomRooflightToOrder
) {

addCustomRooflightToOrder.addEventListener(
"click",
event => {

event.preventDefault();

}
);

}


/* ===============================
INITIAL HOMEPAGE STATE
================================ */

updateEstimatedDeliveryDate(
6
);

setCalculatorSizeAlert(
false
);

hideCustomPriceBox();

calculatePrice();

</script>

</body>
</html>
