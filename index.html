<script>

/* ===============================
MENU
================================ */

function openMenu() {
closeWhatsAppAction();

const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (menuOverlay) {
menuOverlay.classList.add(
"active"
);
}

document.body.style.overflow =
"hidden";
}

function closeMenu() {
const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (menuOverlay) {
menuOverlay.classList.remove(
"active"
);
}

document.body.style.overflow =
"";
}


/* ===============================
WHATSAPP EXPANDING ACTION
================================ */

const whatsappButton =
document.getElementById(
"whatsappButton"
);

const whatsappAction =
document.getElementById(
"whatsappAction"
);

function setWhatsAppState(
shouldOpen
) {

if (
!whatsappButton ||
!whatsappAction
) {
return;
}

whatsappButton.classList.toggle(
"is-selected",
shouldOpen
);

whatsappAction.classList.toggle(
"is-open",
shouldOpen
);

whatsappButton.setAttribute(
"aria-expanded",
String(shouldOpen)
);

}

function closeWhatsAppAction() {
setWhatsAppState(
false
);
}

function toggleWhatsAppAction() {

if (
!whatsappAction
) {
return;
}

const isOpen =
whatsappAction.classList.contains(
"is-open"
);

setWhatsAppState(
!isOpen
);

}

if (
whatsappButton &&
whatsappAction
) {

whatsappButton.addEventListener(
"click",
event => {

event.stopPropagation();

toggleWhatsAppAction();

}
);

whatsappAction.addEventListener(
"click",
event => {

event.stopPropagation();

}
);

}

document.addEventListener(
"click",
closeWhatsAppAction
);

document.addEventListener(
"keydown",
event => {

if (
event.key === "Escape"
) {

closeWhatsAppAction();

closeMenu();

}

}
);


/* ===============================
HOMEPAGE CLOSING — GET IN TOUCH

The closing homepage button returns the
customer to the top of the page and then
opens the existing WhatsApp contact control.
================================ */

const homepageGetInTouch =
document.getElementById(
"homepageGetInTouch"
);

function openHomepageWhatsAppContact() {

if (
!whatsappButton ||
!whatsappAction
) {
return;
}

setWhatsAppState(
true
);

whatsappButton.focus(
{
preventScroll:true
}
);

}

function returnToTopAndOpenWhatsApp() {

closeMenu();

closeWhatsAppAction();

const useSmoothScroll =
!reducedMotionQuery.matches;

window.scrollTo(
{
top:0,
left:0,
behavior:
useSmoothScroll
? "smooth"
: "auto"
}
);

if (
!useSmoothScroll
) {

openHomepageWhatsAppContact();

return;

}

const scrollStartTime =
performance.now();

function waitForTop() {

const currentScrollPosition =
window.scrollY ||
document.documentElement.scrollTop ||
0;

const elapsedTime =
performance.now() -
scrollStartTime;

if (
currentScrollPosition <= 8 ||
elapsedTime >= 1400
) {

window.scrollTo(
{
top:0,
left:0,
behavior:"auto"
}
);

openHomepageWhatsAppContact();

return;

}

window.requestAnimationFrame(
waitForTop
);

}

window.requestAnimationFrame(
waitForTop
);

}

if (
homepageGetInTouch
) {

homepageGetInTouch.addEventListener(
"click",
event => {

event.preventDefault();

event.stopPropagation();

returnToTopAndOpenWhatsApp();

}
);

}


/* ===============================
BASKET TOTAL DISPLAY
================================ */

const basketTotalText =
document.getElementById(
"basketTotalText"
);

let basketAnimationTimer =
null;

function animateBasketTotal() {

if (
!basketTotalText
) {
return;
}

basketTotalText.classList.add(
"is-visible"
);

basketTotalText.classList.remove(
"is-updating"
);

void basketTotalText.offsetWidth;

basketTotalText.classList.add(
"is-updating"
);

if (
basketAnimationTimer !== null
) {

window.clearTimeout(
basketAnimationTimer
);

}

basketAnimationTimer =
window.setTimeout(
() => {

basketTotalText.classList.remove(
"is-updating"
);

},
560
);

}

function updateBasketTotal(
total
) {

const safeTotal =
Number.isFinite(
Number(
total
)
)
? Number(
total
)
: 0;

const formattedTotal =
new Intl.NumberFormat(
"en-GB",
{
style:"currency",
currency:"GBP"
}
).format(
safeTotal
);

if (
basketTotalText
) {

basketTotalText.textContent =
formattedTotal;

basketTotalText.setAttribute(
"aria-label",
"Basket total " +
formattedTotal
);

animateBasketTotal();

}

}

window.setTimeout(
() => {

updateBasketTotal(
0
);

},
2000
);


/* ===============================
MOTION PREFERENCE
================================ */

const reducedMotionQuery =
window.matchMedia(
"(prefers-reduced-motion: reduce)"
);


/* ===============================
STANDARD SCROLL REVEALS
================================ */

const revealElements =
Array.from(
document.querySelectorAll(
".reveal, .direct-image-reveal"
)
);

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

revealElements.forEach(
element => {

element.classList.add(
"is-visible"
);

}
);

} else {

const revealObserver =
new IntersectionObserver(
entries => {

entries.forEach(
entry => {

if (
!entry.isIntersecting
) {
return;
}

entry.target.classList.add(
"is-visible"
);

revealObserver.unobserve(
entry.target
);

}
);

},
{
threshold:.14,
rootMargin:"0px 0px -7% 0px"
}
);

revealElements.forEach(
element => {

revealObserver.observe(
element
);

}
);

}


/* ===============================
STANDARD + TINTED PRODUCT CARDS
================================ */

const homepageProductCards =
Array.from(
document.querySelectorAll(
".home-product-card"
)
);

let activeHomepageProductCard =
null;

function stopHomepageProductAttention() {

homepageProductCards.forEach(
card => {

card.classList.remove(
"is-selected"
);

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.classList.remove(
"is-encouraged"
);

}

}
);

activeHomepageProductCard =
null;

}

function activateHomepageProductCard(
card
) {

if (
!card
) {
return;
}

if (
activeHomepageProductCard &&
activeHomepageProductCard !== card
) {

stopHomepageProductAttention();

}

activeHomepageProductCard =
card;

card.classList.add(
"is-selected"
);

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.classList.remove(
"is-encouraged"
);

void productLink.offsetWidth;

productLink.classList.add(
"is-encouraged"
);

}

}

homepageProductCards.forEach(
card => {

card.addEventListener(
"click",
event => {

const clickedLink =
event.target.closest(
".home-product-link"
);

if (
clickedLink
) {
return;
}

event.stopPropagation();

activateHomepageProductCard(
card
);

}
);

card.addEventListener(
"keydown",
event => {

if (
event.key !== "Enter" &&
event.key !== " "
) {
return;
}

if (
event.target.closest(
"button, a, input, select"
)
) {
return;
}

event.preventDefault();

event.stopPropagation();

activateHomepageProductCard(
card
);

}
);

}
);

document.addEventListener(
"click",
event => {

if (
event.target.closest(
".home-product-card"
)
) {
return;
}

stopHomepageProductAttention();

}
);


/* ===============================
HOMEPAGE PRODUCT INTRODUCTION

Copy is controlled directly by Index 3.
No JavaScript text override is used here.
================================ */


/* ===============================
DELIVERY MASTER

Postcodes.io provides postcode coordinates.
Straight-line geographical distance is
multiplied by 1.20 to provide an allowance
for typical road mileage.

Dispatch postcode:
SL9 7BB
================================ */

const DELIVERY_ORIGIN_POSTCODE =
"SL9 7BB";

const ROAD_DISTANCE_ALLOWANCE =
1.20;


/*
STANDARD EXTRA LARGE DELIVERY SIZES

All Extra Large listed sizes use
postcode-based delivery pricing.

XL1 = 600–800mm wide
XL2 = 801–1199mm wide
XL3 = 1200–1500mm wide
*/

const chargeableExtraLargeSizes =
new Set([
"600x2500",
"800x2500",
"1000x2500",
"1500x1500",
"1500x1800",
"1500x2500"
]);


const deliveryRates = [

{
maxMiles:30,
XL1:35,
XL2:55,
XL3:110
},

{
maxMiles:60,
XL1:65,
XL2:105,
XL3:140
},

{
maxMiles:100,
XL1:105,
XL2:135,
XL3:175
},

{
maxMiles:150,
XL1:135,
XL2:170,
XL3:220
},

{
maxMiles:200,
XL1:170,
XL2:215,
XL3:275
}

];


function normalizeRooflightSize(
size
) {

return String(
size ?? ""
)
.trim()
.toLowerCase()
.replace(/mm/g,"")
.replace(/×/g,"x")
.replace(/\s+/g,"");

}


function formatDeliverySize(
size
) {

const normalizedSize =
normalizeRooflightSize(
size
);

return normalizedSize.replace(
"x",
" × "
) + "mm";

}


function getHomepageCardSize(
card
) {

if (
!card
) {
return "";
}

const sizeClass =
Array.from(
card.classList
).find(
className =>
/^image-size-\d+x\d+$/i.test(
className
)
);

if (
sizeClass
) {

return sizeClass.replace(
"image-size-",
""
);

}

const sizeElement =
card.querySelector(
".home-product-size"
);

if (
!sizeElement
) {
return "";
}

return normalizeRooflightSize(
sizeElement.textContent
);

}


function isChargeableExtraLargeSize(
size
) {

return chargeableExtraLargeSizes.has(
normalizeRooflightSize(
size
)
);

}


function getXLDeliveryBand(
size
) {

const normalizedSize =
normalizeRooflightSize(
size
);

if (
!isChargeableExtraLargeSize(
normalizedSize
)
) {
return null;
}

const [
width
] =
normalizedSize
.split("x")
.map(Number);

if (
width >= 600 &&
width <= 800
) {

return "XL1";

}

if (
width >= 801 &&
width <= 1199
) {

return "XL2";

}

if (
width >= 1200 &&
width <= 1500
) {

return "XL3";

}

return null;

}


function getDeliveryRate(
adjustedMiles,
band
) {

for (
const rateBand
of deliveryRates
) {

if (
adjustedMiles <=
rateBand.maxMiles
) {

return {
requiresQuote:false,
price:rateBand[band],
maxMiles:rateBand.maxMiles
};

}

}

return {
requiresQuote:true,
price:null,
maxMiles:null
};

}


function degreesToRadians(
degrees
) {

return degrees *
(Math.PI / 180);

}


function calculateGeographicalMiles(
lat1,
lon1,
lat2,
lon2
) {

const earthRadiusMiles =
3958.7613;

const latitudeDifference =
degreesToRadians(
lat2 - lat1
);

const longitudeDifference =
degreesToRadians(
lon2 - lon1
);

const firstLatitude =
degreesToRadians(
lat1
);

const secondLatitude =
degreesToRadians(
lat2
);

const a =
Math.sin(
latitudeDifference / 2
) ** 2
+
Math.cos(
firstLatitude
)
*
Math.cos(
secondLatitude
)
*
Math.sin(
longitudeDifference / 2
) ** 2;

const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1 - a)
);

return earthRadiusMiles * c;

}


async function lookupPostcode(
postcode
) {

const cleanedPostcode =
String(
postcode || ""
)
.trim()
.toUpperCase();

if (
!cleanedPostcode
) {

throw new Error(
"Please enter a postcode."
);

}

const response =
await fetch(
"https://api.postcodes.io/postcodes/" +
encodeURIComponent(
cleanedPostcode
)
);

if (
!response.ok
) {

throw new Error(
"That postcode could not be found."
);

}

const data =
await response.json();

if (
!data ||
!data.result
) {

throw new Error(
"That postcode could not be found."
);

}

return data.result;

}


async function calculateExtraLargeDelivery(
size,
postcode
) {

const normalizedSize =
normalizeRooflightSize(
size
);

if (
!isChargeableExtraLargeSize(
normalizedSize
)
) {

return {
requiresQuote:false,
freeDelivery:true,
price:0,
size:normalizedSize,
band:null,
rawMiles:0,
adjustedMiles:0,
reason:
"Free mainland UK delivery applies to this size."
};

}

const band =
getXLDeliveryBand(
normalizedSize
);

if (
!band
) {

return {
requiresQuote:true,
freeDelivery:false,
price:null,
size:normalizedSize,
band:null,
reason:
"Delivery for this size requires a quotation."
};

}

const [
origin,
destination
] =
await Promise.all([
lookupPostcode(
DELIVERY_ORIGIN_POSTCODE
),
lookupPostcode(
postcode
)
]);

const destinationCountry =
String(
destination.country || ""
)
.trim();

if (
destinationCountry !==
"England"
) {

return {
requiresQuote:true,
freeDelivery:false,
price:null,
size:normalizedSize,
band:band,
country:destinationCountry,
reason:
"Delivery quotation required for this destination."
};

}

const rawMiles =
calculateGeographicalMiles(
origin.latitude,
origin.longitude,
destination.latitude,
destination.longitude
);

const adjustedMiles =
rawMiles *
ROAD_DISTANCE_ALLOWANCE;

const deliveryRate =
getDeliveryRate(
adjustedMiles,
band
);

if (
deliveryRate.requiresQuote
) {

return {
requiresQuote:true,
freeDelivery:false,
price:null,
size:normalizedSize,
band:band,
country:destinationCountry,
rawMiles:rawMiles,
adjustedMiles:adjustedMiles,
reason:
"Delivery quotation required for destinations over 200 adjusted miles."
};

}

return {
requiresQuote:false,
freeDelivery:false,
price:deliveryRate.price,
size:normalizedSize,
band:band,
country:destinationCountry,
rawMiles:rawMiles,
adjustedMiles:adjustedMiles,
reason:null
};

}


/* ===============================
HOMEPAGE PRODUCT SPECIFICATION LINES

Standard/tinted product cards use:

1. Inside Visible Glass Size
2. Toughened Safety Glass specification
3. Free Mainland UK Delivery OR
Delivery Calculated By Postcode
================================ */

function updateHomepageProductSpecifications() {

homepageProductCards.forEach(
card => {

const spec =
card.querySelector(
".home-product-spec"
);

if (
!spec
) {
return;
}

const size =
getHomepageCardSize(
card
);

const existingLines =
Array.from(
spec.querySelectorAll(
"span"
)
);

let glassLine =
"6mm Toughened Safety Glass";

const glassMatch =
existingLines
.map(
line => String(
line.textContent || ""
).trim()
)
.find(
line =>
/\d+mm\s+toughened\s+safety\s+glass/i.test(
line
)
);

if (
glassMatch
) {

glassLine =
glassMatch;

}

const chargeableDelivery =
isChargeableExtraLargeSize(
size
);

spec.innerHTML = `
<span class="product-internal-size">Inside Visible Glass Size</span>
<span class="product-glass-spec">${glassLine}</span>
<span class="${chargeableDelivery ? "product-delivery-chargeable" : "product-delivery-free"}">${chargeableDelivery ? "Delivery Calculated By Postcode" : "Free Mainland UK Delivery"}</span>
`;

card.dataset.deliveryType =
chargeableDelivery
? "postcode"
: "free";

if (
chargeableDelivery
) {

card.dataset.deliveryBand =
getXLDeliveryBand(
size
) || "";

} else {

delete card.dataset.deliveryBand;

}

}
);

}

updateHomepageProductSpecifications();


window.calculateExtraLargeDelivery =
calculateExtraLargeDelivery;

window.getXLDeliveryBand =
getXLDeliveryBand;


/* ===============================
MOBILE FEATURE ICON SHIMMER
================================ */

const mobileFeatureIcons =
document.getElementById(
"mobileFeatureIcons"
);

if (
mobileFeatureIcons
) {

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {

mobileFeatureIcons.classList.add(
"icon-shimmer-active"
);

} else {

const mobileFeatureObserver =
new IntersectionObserver(
entries => {

entries.forEach(
entry => {

if (
!entry.isIntersecting
) {
return;
}

entry.target.classList.add(
"icon-shimmer-active"
);

mobileFeatureObserver.unobserve(
entry.target
);

}
);

},
{
threshold:.45,
rootMargin:"0px 0px -6% 0px"
}
);

mobileFeatureObserver.observe(
mobileFeatureIcons
);

}

}


/* ===============================
ENGINEERED CARD FULL-VIEW SHIMMERS
================================ */

const engineeredItems =
Array.from(
document.querySelectorAll(
".engineered-card"
)
);

let engineeredShimmerFrame =
null;

function getVisiblePageTop() {

const pageHeader =
document.querySelector(
"header"
);

if (
!pageHeader
) {
return 0;
}

return Math.max(
0,
pageHeader
.getBoundingClientRect()
.bottom
);

}

function checkEngineeredCardShimmers() {

engineeredShimmerFrame =
null;

if (
reducedMotionQuery.matches ||
engineeredItems.length === 0
) {
return;
}

const visibleTop =
getVisiblePageTop();

const visibleBottom =
window.innerHeight - 8;

engineeredItems.forEach(
item => {

if (
item.dataset.shimmerPlayed ===
"true"
) {
return;
}

const itemRect =
item.getBoundingClientRect();

const isFullyVisible =
itemRect.top >= visibleTop &&
itemRect.bottom <= visibleBottom;

if (
!isFullyVisible
) {
return;
}

item.dataset.shimmerPlayed =
"true";

item.classList.add(
"shimmer-play"
);

}
);

}

function requestEngineeredShimmerCheck() {

if (
engineeredShimmerFrame !== null
) {
return;
}

engineeredShimmerFrame =
window.requestAnimationFrame(
checkEngineeredCardShimmers
);

}

if (
reducedMotionQuery.matches
) {

engineeredItems.forEach(
item => {

item.dataset.shimmerPlayed =
"true";

}
);

} else {

window.addEventListener(
"scroll",
requestEngineeredShimmerCheck,
{
passive:true
}
);

window.addEventListener(
"resize",
requestEngineeredShimmerCheck
);

window.addEventListener(
"load",
requestEngineeredShimmerCheck
);

requestEngineeredShimmerCheck();

}


/* ===============================
PROFESSIONAL FITTING MANUAL SLIDESHOW

Manual only:
- No autoplay
- Swipe left = next
- Swipe right = previous
- Mouse drag also supported
- Loops continuously in both directions

Images:
1. hero-rooflight-1.png
2. hero-rooflight-2.png
3. hero-rooflight-7.png
4. hero-rooflight-8.png

Progress:
1 = 25%
2 = 50%
3 = 75%
4 = 100%
================================ */

const fittingSlideshow =
document.getElementById(
"fittingSlideshow"
);

const fittingSlideshowViewport =
document.getElementById(
"fittingSlideshowViewport"
);

const fittingSlideshowProgress =
document.getElementById(
"fittingSlideshowProgress"
);

const fittingSlides =
fittingSlideshow
? Array.from(
fittingSlideshow.querySelectorAll(
".fitting-slide"
)
)
: [];

let activeFittingSlideIndex =
0;

let fittingTouchStartX =
0;

let fittingTouchStartY =
0;

let fittingTouchEndX =
0;

let fittingTouchEndY =
0;

let fittingMouseStartX =
0;

let fittingMouseStartY =
0;

let fittingMouseEndX =
0;

let fittingMouseEndY =
0;

let fittingMouseDragging =
false;

const FITTING_SWIPE_THRESHOLD =
45;


/* ===============================
FITTING SLIDESHOW INDEX HELPER
================================ */

function normalizeFittingSlideIndex(
index
) {

if (
fittingSlides.length === 0
) {
return 0;
}

return (
index +
fittingSlides.length
) %
fittingSlides.length;

}


/* ===============================
FITTING PROGRESS BAR
================================ */

function updateFittingSlideshowProgress() {

if (
!fittingSlideshowProgress ||
fittingSlides.length === 0
) {
return;
}

const progress =
(
(
activeFittingSlideIndex + 1
) /
fittingSlides.length
) *
100;

fittingSlideshowProgress.style.width =
`${progress}%`;

}


/* ===============================
DISPLAY FITTING SLIDE
================================ */

function showFittingSlide(
newIndex,
direction = "next"
) {

if (
fittingSlides.length === 0
) {
return;
}

const normalizedIndex =
normalizeFittingSlideIndex(
newIndex
);

if (
normalizedIndex ===
activeFittingSlideIndex
) {

updateFittingSlideshowProgress();

return;

}

const oldIndex =
activeFittingSlideIndex;

const oldSlide =
fittingSlides[
oldIndex
];

const newSlide =
fittingSlides[
normalizedIndex
];


/*
Remove all transitional states first so
each swipe starts from a predictable state.
*/

fittingSlides.forEach(
slide => {

slide.classList.remove(
"active",
"previous"
);

slide.setAttribute(
"aria-hidden",
"true"
);

}
);


/*
The existing Index 3 animation expects:

active = visible/current
previous = outgoing left position

For a forward swipe the outgoing image is
marked previous.

For a backwards swipe the destination is
briefly placed in the previous position,
then promoted to active on the next frame.
*/

if (
direction === "previous"
) {

newSlide.classList.add(
"previous"
);

void newSlide.offsetWidth;

window.requestAnimationFrame(
() => {

newSlide.classList.remove(
"previous"
);

newSlide.classList.add(
"active"
);

newSlide.setAttribute(
"aria-hidden",
"false"
);

}
);

} else {

if (
oldSlide
) {

oldSlide.classList.add(
"previous"
);

}

newSlide.classList.add(
"active"
);

newSlide.setAttribute(
"aria-hidden",
"false"
);

}

activeFittingSlideIndex =
normalizedIndex;

updateFittingSlideshowProgress();

}


/* ===============================
FITTING NEXT / PREVIOUS
================================ */

function showNextFittingSlide() {

showFittingSlide(
activeFittingSlideIndex + 1,
"next"
);

}

function showPreviousFittingSlide() {

showFittingSlide(
activeFittingSlideIndex - 1,
"previous"
);

}


/* ===============================
SWIPE DIRECTION CHECK
================================ */

function processFittingSwipe(
startX,
startY,
endX,
endY
) {

const horizontalDistance =
endX - startX;

const verticalDistance =
endY - startY;

const absoluteHorizontalDistance =
Math.abs(
horizontalDistance
);

const absoluteVerticalDistance =
Math.abs(
verticalDistance
);


/*
Ignore short movements and ordinary
vertical page scrolling.
*/

if (
absoluteHorizontalDistance <
FITTING_SWIPE_THRESHOLD
) {
return;
}

if (
absoluteHorizontalDistance <=
absoluteVerticalDistance
) {
return;
}


/*

/* ===============================
STANDARD + TINTED PRICE FORMATTING

Numeric homepage product prices are
structured as:

£400. + small 00

The decimal point belongs to the
full-size main price.

Only the two decimal digits use the
smaller top-aligned styling from Index 1.
================================ */

function formatProductPrice(
selectedPrice
) {

const normalizedPrice =
String(
selectedPrice ?? ""
)
.trim();

if (
normalizedPrice === "" ||
normalizedPrice.toUpperCase() ===
"TBC"
) {

return "£TBC";

}

const cleanedPrice =
normalizedPrice
.replace(
/£/g,
""
)
.replace(
/,/g,
""
)
.trim();

const numericPrice =
Number(
cleanedPrice
);

if (
!Number.isFinite(
numericPrice
)
) {

return "£" +
cleanedPrice;

}

const wholePounds =
Math.trunc(
numericPrice
);

const formattedWholePounds =
new Intl.NumberFormat(
"en-GB",
{
maximumFractionDigits:0
}
).format(
wholePounds
);

const decimalValue =
Math.round(
(
numericPrice -
wholePounds
) *
100
);

const formattedDecimals =
String(
decimalValue
)
.padStart(
2,
"0"
);

return `
<span class="home-price-amount">

<span class="home-price-main">
£${formattedWholePounds}<span class="home-price-decimal-point">.</span>
</span>

<span class="home-price-decimals">
${formattedDecimals}
</span>

</span>
`;

}

Legacy double/triple values remain

================================ */

function getCustomGlazingDetails(

const normalizedGlazing =
String(
glazing ?? ""

.toLowerCase();

const isTriple =

const isLaminated =

const construction =
isLaminated
? "laminated"
: "toughened";

const configuration =
isTriple
? "triple"
: "double";

return {
value:normalizedGlazing,
construction:construction,
configuration:configuration,
isLaminated:isLaminated,
isToughened:!isLaminated,
isTriple:isTriple,
isDouble:!isTriple
};

}

/* ===============================
WORKING-DAY DATE HELPER
================================ */

function addWorkingDays(
numberOfWorkingDays
) {

const deliveryDate =
new Date();

deliveryDate.setHours(
12,
0,
0,
0
);

let workingDaysRemaining =
Number(
numberOfWorkingDays
);

while (
workingDaysRemaining > 0
) {

deliveryDate.setDate(
deliveryDate.getDate() + 1
);

const dayOfWeek =
deliveryDate.getDay();

if (
dayOfWeek !== 0 &&
dayOfWeek !== 6
) {

workingDaysRemaining -=
1;

}

}

return deliveryDate;

}


/* ===============================
ESTIMATED PRODUCTION LEAD TIME

Up to 1000 × 2500:
4–6 working days

Larger:
6–8 working days

BLUE / GREY / SATIN
Up to 1000 × 2500:
6–8 working days

Larger:
8–10 working days
================================ */

function getCustomLeadTime(
width,
length,
finish
) {

const normalizedFinish =
String(
finish ?? ""
)
.trim()
.toLowerCase();

const isClear =
normalizedFinish === "clear";

const isStandardLeadTimeSize =
width <= 1000 &&
length <= 2500;

if (
isClear &&
isStandardLeadTimeSize
) {

return {
minimum:4,
maximum:6,
label:"Estimated 4–6 working days"
};

}

if (
isClear &&
!isStandardLeadTimeSize
) {

return {
minimum:6,
maximum:8,
label:"Estimated 6–8 working days"
};

}

if (
!isClear &&
isStandardLeadTimeSize
) {

return {
minimum:6,
maximum:8,
label:"Estimated 6–8 working days"
};

}

return {
minimum:8,
maximum:10,
label:"Estimated 8–10 working days"
};

}

/* ===============================
CUSTOM DELIVERY CLASSIFICATION

The custom builder does not yet ask for a
postcode, so it stores whether the selected
size is free-delivery eligible or requires
postcode-based delivery pricing.

The same XL width band is then available
to basket / checkout when the postcode
stage is connected.
================================ */

function getCustomDeliveryBand(
width,
length
) {

const numericWidth =
Number(
width
);

const numericLength =
Number(
length
);

if (
!Number.isFinite(
numericWidth
) ||
!Number.isFinite(
numericLength
)
) {
return null;
}

const isExtraLargeLength =
numericLength >= 2500 &&
numericWidth >= 600;

const isExtraLargeWidth =
numericWidth >= 1500 &&
numericLength >= 1500;

if (
!isExtraLargeLength &&
!isExtraLargeWidth
) {
return null;
}

if (
numericWidth >= 600 &&
numericWidth <= 800
) {

return "XL1";

}

if (
numericWidth >= 801 &&
numericWidth <= 1199
) {

return "XL2";

}

if (
numericWidth >= 1200 &&
numericWidth <= 1500
) {

return "XL3";

}

return null;

}


/* ===============================
CUSTOM ROOFLIGHT PRICE
================================ */

function calculatePrice() {

if (
!customWidthInput ||
!customLengthInput ||
!customBorderInput ||
!customGlazingInput ||
!customFinishInput ||
!customPriceOutput ||
!customPriceBox ||
!customPriceInternal ||
!customPriceExternal
) {
return;
}

const width =
getNumericInputValue(
customWidthInput
);

const length =
getNumericInputValue(
customLengthInput
);


/* ===============================
ONLINE MAXIMUM

1500mm internal width
2500mm internal length
================================ */

const widthAboveMaximum =
width !== null &&
width > 1500;

const lengthAboveMaximum =
length !== null &&
length > 2500;

const exceedsOnlineMaximum =
widthAboveMaximum ||
lengthAboveMaximum;

setCalculatorSizeAlert(
exceedsOnlineMaximum
);


/* ===============================
VALID ONLINE DIMENSIONS
================================ */

const dimensionsComplete =
width !== null &&
length !== null;

const dimensionsValid =
dimensionsComplete &&
width >= 300 &&
width <= 1500 &&
length >= 300 &&
length <= 2500;

if (
!dimensionsValid
) {

hideCustomPriceBox();

return;

}


/* ===============================
SELECTED SPECIFICATION
================================ */

const glazing =
customGlazingInput.value;

const glazingDetails =
getCustomGlazingDetails(
glazing
);

const finish =
customFinishInput.value;

const border =
getCustomBorderSize();


/* ===============================
INTERNAL + EXTERNAL SIZE
================================ */

const externalWidth =
width +
(
border * 2
);

const externalLength =
length +
(
border * 2
);

const area =
(
width * length
) /
1000000;


/* ===============================
CURRENT ONLINE PRICING LOGIC

The existing Double / Triple online
pricing structure is retained.

Laminated Double currently follows the
Double Glazed rate.

Laminated Triple currently follows the
Triple Glazed rate.

Dedicated laminated pricing can be
introduced separately without changing
the four glazing option values.
================================ */

const baseRate =
glazingDetails.isTriple
? 375
: 290;

let price =
area *
baseRate;

const normalizedFinish =
String(
finish
)
.trim()
.toLowerCase();

if (
normalizedFinish !== "clear"
) {

price +=
area * 45;

}

price +=
90;


/* ===============================
MINIMUM ONLINE PRICES
================================ */

if (
price < 250 &&
glazingDetails.isDouble
) {

price =
250;

}

if (
price < 300 &&
glazingDetails.isTriple
) {

price =
300;

}

const roundedPrice =
Math.round(
price
);


/* ===============================
LEAD TIME + DELIVERY ESTIMATE
================================ */

const leadTime =
getCustomLeadTime(
width,
length,
finish
);

updateEstimatedDeliveryDate(
leadTime.maximum
);

const customDeliveryBand =
getCustomDeliveryBand(
width,
length
);

const customDeliveryType =
customDeliveryBand
? "postcode"
: "free";


/* ===============================
DISPLAY PRICE
================================ */

customPriceOutput.textContent =
"£" +
roundedPrice;

customPriceInternal.textContent =
`${formatRooflightDimension(width)}mm × ${formatRooflightDimension(length)}mm`;

customPriceExternal.textContent =
`${formatRooflightDimension(externalWidth)}mm × ${formatRooflightDimension(externalLength)}mm`;


/* ===============================
STORE CURRENT CONFIGURATION
================================ */

if (
addCustomRooflightToOrder
) {

addCustomRooflightToOrder.dataset.price =
String(
roundedPrice
);

addCustomRooflightToOrder.dataset.internalWidth =
String(
width
);

addCustomRooflightToOrder.dataset.internalLength =
String(
length
);

addCustomRooflightToOrder.dataset.externalWidth =
String(
externalWidth
);

addCustomRooflightToOrder.dataset.externalLength =
String(
externalLength
);

addCustomRooflightToOrder.dataset.border =
String(
border
);

addCustomRooflightToOrder.dataset.glazing =
glazingDetails.value;

addCustomRooflightToOrder.dataset.glazingConstruction =
glazingDetails.construction;

addCustomRooflightToOrder.dataset.glazingConfiguration =
glazingDetails.configuration;

addCustomRooflightToOrder.dataset.finish =
finish;

addCustomRooflightToOrder.dataset.leadTimeMinimum =
String(
leadTime.minimum
);

addCustomRooflightToOrder.dataset.leadTimeMaximum =
String(
leadTime.maximum
);

addCustomRooflightToOrder.dataset.leadTimeLabel =
leadTime.label;

addCustomRooflightToOrder.dataset.deliveryType =
customDeliveryType;

if (
customDeliveryBand
) {

addCustomRooflightToOrder.dataset.deliveryBand =
customDeliveryBand;

} else {

delete addCustomRooflightToOrder.dataset.deliveryBand;

}

}

showCustomPriceBox();

}


/* ===============================
CUSTOM BUILDER INPUT EVENTS
================================ */

[
customWidthInput,
customLengthInput,
customBorderInput,
customGlazingInput,
customFinishInput
]
.forEach(
element => {

if (
!element
) {
return;
}

element.addEventListener(
"input",
calculatePrice
);

element.addEventListener(
"change",
calculatePrice
);

}
);


/* ===============================
ADD TO ORDER PLACEHOLDER

Basket/order storage will connect here
when the checkout stage is added.
================================ */

if (
addCustomRooflightToOrder
) {

addCustomRooflightToOrder.addEventListener(
"click",
event => {

event.preventDefault();

}
);

}


/* ===============================
INITIAL HOMEPAGE STATE
================================ */

updateEstimatedDeliveryDate(
6
);

setCalculatorSizeAlert(
false
);

hideCustomPriceBox();

calculatePrice();

</script>

</body>
</html>
